[project]
name = "seatsurge"
version = "0.1.0"
description = "A ticket booking backend that never oversells under heavy concurrency."
readme = "README.md"
# The stack is fixed to Python 3.12 (CLAUDE.md section 2).
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.1",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]
