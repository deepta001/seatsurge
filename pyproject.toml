[project]
name = "seatsurge"
version = "0.1.0"
description = "A ticket booking backend that never oversells under heavy concurrency."
readme = "README.md"
# The stack is fixed to Python 3.12 (CLAUDE.md section 2).
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "testcontainers>=4.15.0",
]
load = [
    "locust>=2.47.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests `import app...` no matter where pytest is started from.
pythonpath = ["."]
# `async def` tests run without extra markers, all sharing one event loop, so
# the session-wide database engine can be reused by every test.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "backstop: the test trips a database backstop on purpose (invariant_violations_total may rise)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused or undefined names), I: import order,
# B: common bug patterns, UP: use modern Python syntax.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `param = Depends(...)` pattern is intended, not the classic
# "function call in a default argument" bug.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests", "scripts", "migrations"]
# Every function must have type hints, even outside app/services.
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# CLAUDE.md section 2: mypy is strict on app/services (the business logic).
[[tool.mypy.overrides]]
module = "app.services.*"
strict = true
