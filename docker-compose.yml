# The whole seatsurge system on one machine.
#   Databases only (for local dev and tests):  docker compose up -d postgres redis
#   Everything (S8.1):                         docker compose up -d --build
#     -> the API at http://127.0.0.1:8080 (nginx in front of 3 api replicas)
#   Stop: docker compose down
# Passwords come from .env; Compose reads that file automatically.
#   Prometheus: http://127.0.0.1:9090   Grafana: http://127.0.0.1:3000 (admin + GRAFANA_ADMIN_PASSWORD)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seatsurge
      POSTGRES_DB: seatsurge
      # `:?` makes Compose refuse to start if the variable is missing,
      # instead of silently creating a database with an empty password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 127.0.0.1 = reachable only from this computer, not from your network.
      - "127.0.0.1:5432:5432"
    volumes:
      # A named volume keeps the data when the container is removed.
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "seatsurge", "-d", "seatsurge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Redis has no password by default; CLAUDE.md section 9 requires one.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      # Lets the healthcheck's redis-cli log in without putting the password
      # on its command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- The application (S8.1) ----------------------------------------------
  # One image, three roles: migrate (runs once), api (x3) and worker.

  # Applies Alembic migrations, then exits. The app never creates tables by
  # itself (CLAUDE.md section 6); the api and worker wait for this to succeed.
  migrate:
    build: .
    image: seatsurge-app
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment: &app-env
      # Inside the Compose network services are reached by name (postgres,
      # redis), not 127.0.0.1. These override the URLs in .env.
      DATABASE_URL: postgresql+asyncpg://seatsurge:${POSTGRES_PASSWORD}@postgres:5432/seatsurge
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOG_FORMAT: json  # one JSON object per line (S8.2b)
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  api:
    image: seatsurge-app
    env_file: .env
    environment:
      <<: *app-env
      # Trust X-Forwarded-For ONLY from nginx's fixed address, so a client
      # can't claim another IP to dodge the per-IP login limit.
      FORWARDED_ALLOW_IPS: 172.28.5.10
    deploy:
      replicas: 3
    # No `ports:` on purpose: the replicas are reachable only through nginx.
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    image: seatsurge-app
    command: ["python", "-m", "app.worker.main"]
    env_file: .env
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]

  # The load balancer and the only way in: requests go to the 3 api replicas
  # in turn (round robin). The unprivileged image runs as a normal user.
  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api: { condition: service_healthy }
    networks:
      backend:
        ipv4_address: 172.28.5.10  # fixed, so the api can trust exactly this address

  # ---- Observability (S8.2) --------------------------------------------------
  # Prometheus scrapes every api replica and the worker; Grafana graphs it.
  # Both listen on 127.0.0.1 only, and nginx never routes to either.

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [api, worker]
    networks: [backend]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # No default credentials (CLAUDE.md section 9): Compose refuses to start
      # without a password in .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [backend]

networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.5.0/24

volumes:
  postgres-data:
