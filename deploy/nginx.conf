# nginx as a round-robin load balancer in front of the 3 api replicas (S8.1).
# It does nothing else: no caching, no business logic (CLAUDE.md section 2).

worker_processes auto;
# The unprivileged image runs as a normal user, who may only write in /tmp.
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # nginx's access log ends with the request id, the same correlation id
    # the api and worker log, so one search finds the request everywhere.
    log_format with_id '$remote_addr [$time_iso8601] "$request" $status '
                       '$request_time correlation_id=$request_id';
    access_log /dev/stdout with_id;
    error_log  /dev/stderr warn;
    server_tokens off;  # don't advertise the nginx version

    # Docker's internal DNS. "api" resolves to one address per replica; with
    # `resolve`, nginx re-checks every 10 s, so a restarted replica (new
    # address) is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api {
        zone api 64k;  # shared memory, needed for `resolve`
        # No balancing method named = round robin: each request goes to the
        # next replica in turn.
        server api:8000 resolve;
        keepalive 64;  # reuse connections to the replicas instead of reopening them
    }

    server {
        listen 8080;

        # The app refuses bodies over 16 KB anyway; stop them here first.
        client_max_body_size 16k;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";  # needed for upstream keepalive
            proxy_set_header Host $host;
            # OVERWRITE (never append) the client address with the one nginx
            # actually saw. A client sending its own X-Forwarded-For can't
            # fake its IP; the api trusts this header only from nginx.
            proxy_set_header X-Forwarded-For $remote_addr;
            # A fresh id per request, made by nginx (32 hex characters). It
            # replaces any id the client sent.
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header X-Forwarded-Proto $scheme;
            # If a replica is down or refuses, try the next one, but only for
            # GET-like requests: a POST may already have taken effect.
            proxy_next_upstream error timeout;
        }

        # Live availability (Server-Sent Events, S7.3): pass every event
        # through at once instead of buffering, and allow long-lived streams.
        # (The app also sends X-Accel-Buffering: no; this makes it explicit.)
        location ~ ^/events/[0-9]+/stream$ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # A fresh id per request, made by nginx (32 hex characters). It
            # replaces any id the client sent.
            proxy_set_header X-Correlation-ID $request_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;  # the app sends a keep-alive every 15 s
        }

        # Internal only (CLAUDE.md section 9): never routed to the outside.
        location = /metrics {
            return 404;
        }
    }
}
