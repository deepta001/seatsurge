# Continuous integration: on every push and pull request, GitHub starts a
# fresh Linux machine, installs the exact locked dependencies, and runs the
# same checks you run locally. A red X on GitHub means one of them failed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only access is all these checks need.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A throwaway Postgres 16 that exists only for this CI run, used to prove
    # the migrations apply cleanly. The password is a dummy; nothing real lives here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seatsurge
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: seatsurge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatsurge -d seatsurge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # There's no .env in CI, so the settings come from here. Redis isn't
    # needed for these steps, but the settings require a value.
    env:
      DATABASE_URL: postgresql+asyncpg://seatsurge:ci-only-password@127.0.0.1:5432/seatsurge
      REDIS_URL: redis://:unused@127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-only-signing-key-not-used-for-anything-real

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # --locked fails if uv.lock is out of date with pyproject.toml, so CI
      # never quietly uses different versions than you do. uv also installs
      # the Python version named in .python-version (3.12).
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run python -m ruff check .

      - name: Formatting (ruff)
        run: uv run python -m ruff format --check .

      - name: Type check (mypy)
        run: uv run python -m mypy

      # tests/conftest.py replaces the settings with dummy addresses, so the
      # unit tests never touch the Postgres service above.
      - name: Tests (pytest)
        run: uv run python -m pytest -v

      # S8.1: the app image builds, and nginx accepts its config.
      - name: App image builds
        run: docker build --tag seatsurge-app .

      - name: nginx config is valid
        run: >-
          docker run --rm -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginxinc/nginx-unprivileged:1.28-alpine nginx -t

      - name: Migrations apply to an empty database
        run: uv run python -m alembic upgrade head

      # Fails if a model was changed without writing a matching migration.
      - name: Migrations match the models
        run: uv run python -m alembic check

      - name: Migrations can be undone and redone
        run: |
          uv run python -m alembic downgrade base
          uv run python -m alembic upgrade head
